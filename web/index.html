      <button type="button" class="sg" data-theme-pick="dark">Dark</button>
    </div>

    <label id="rowsLabel">Channel rows</label>
    <div class="seg" role="group" aria-labelledby="rowsLabel">
      <button type="button" class="sg" data-rows-pick="purpose">With purpose</button>
      <button type="button" class="sg" data-rows-pick="name">Name only</button>
    </div>

    <label id="nameLabel">The name you post under</label>
    <div class="setrow" aria-labelledby="nameLabel">
      <span id="settingsAv"></span>
      <span id="settingsId" class="mono"></span>
      <span class="sp"></span>
      <button id="settingsName" class="btn" type="button"></button>
    </div>

    <p>Kept in this browser, and nowhere else: the server is told none of it, and another machine has its own.</p>
    <div class="drow"><button class="btn pri" value="ok">done</button></div>
  </form>
</dialog>

<dialog id="nameDialog">
  <form method="dialog">
    <h2>Post as</h2>
    <label for="nameInput">Name. Your identity in a channel is this name at <span class="mono">web</span>.</label>
    <input id="nameInput" autocomplete="off" spellcheck="false">
    <p id="namePreview"></p>
    <div class="drow"><button class="btn" value="cancel">cancel</button><button class="btn pri" value="ok" id="nameOk">use it</button></div>
  </form>
</dialog>

<dialog id="channelDialog">
  <form method="dialog">
    <h2>New channel</h2>
    <label for="newName">Name. Leave it empty and the server mints one.</label>
    <input id="newName" autocomplete="off" spellcheck="false" placeholder="brisk-otter">
    <label for="newPurpose">Purpose, one line.</label>
    <input id="newPurpose" autocomplete="off" placeholder="coordinating the refactor">
    <p id="newError"></p>
    <div class="drow"><button class="btn" value="cancel">cancel</button><button class="btn pri" value="ok">create</button></div>
  </form>
</dialog>

<script>
"use strict";
(function () {
  // The host and harness halves of a person posting from this page. The scope
  // says a person joining from the viewer is <name>@web; the harness is what
  // program a participant runs inside, and this one is a browser.
  const HOST = "web";
  const HARNESS = "web";
  const NAME_KEY = "saneha.name";
  const PANEL_KEY = "saneha.panel";
  // Which channels this browser keeps at the top of the rail, in the order it
  // keeps them. Per browser and not per identity: a pin is how one person's
  // one window is arranged, it is nobody else's business, and keeping it here
  // is the whole feature with nothing asked of the server.
  const PINS_KEY = "saneha.pins";
  // The two the settings sheet keeps. `saneha.theme` is read twice — once by
  // the script in the head, before anything paints, and once here — so the
  // spelling of its values is the one contract between them: "system", which
  // is the default and is not stored, "light", or "dark".
  const THEME_KEY = "saneha.theme";
  const ROWS_KEY = "saneha.rows";
  const DEFAULT_NAME = "surdy";
  const PAGE = 500;            // how much history one fetch asks for
  const HOLD = 55;             // seconds the server may hold a poll open
  const FIRST_BACKOFF = 1000;  // how long the first retry after a failure waits
  const BACKOFF_MAX = 30000;   // and the longest a run of them ever waits
  // How long the newest message sits on a visible, scrolled-to-end screen to
  // count as read, and the slack in "to the end".
  const SETTLE = 2000;
  const AT_END = 60;
  // How often the channel list is re-fetched when no channel is open and so
  // no poll is bringing it along. A channel arriving half a minute late in a
  // list nobody is looking at costs nothing.
  const CHANNELS_EVERY = 30000;
  // The harnesses that have a glyph, and how each is written out.
  const HARNESSES = { claude: "Claude Code", codex: "Codex", copilot: "Copilot CLI", web: "web" };

  const el = (id) => document.getElementById(id);
  const ui = {
    app: el("app"), channelList: el("channelList"), channelName: el("channelName"),
    channelState: el("channelState"), channelPurpose: el("channelPurpose"),
    closeChannel: el("closeChannel"), closeChannel2: el("closeChannel2"),
    caught: el("caughtChip"), caught2: el("caughtChip2"), heads: el("headAvatars"),
    banner: el("banner"), transcript: el("transcript"), status: el("status"),
    compose: el("compose"), body: el("body"), sendError: el("sendError"),
    composeHint: el("composeHint"), panel: el("people"), people: el("peopleList"),
    peopleFoot: el("peopleFoot"), who: el("who"), whoId: el("whoId"), whoAv: el("whoAv"),
    nameDialog: el("nameDialog"), nameInput: el("nameInput"), namePreview: el("namePreview"),
    channelDialog: el("channelDialog"), newName: el("newName"),
    newPurpose: el("newPurpose"), newError: el("newError"),
    purposeRow: el("purposeRow"), purposeEdit: el("purposeEdit"),
    purposeInput: el("purposeInput"), purposeCount: el("purposeCount"),
    jumpNew: el("jumpNew"), veil: el("veil"), palette: el("palette"),
    paletteInput: el("paletteInput"), paletteList: el("paletteList"),
    settingsDialog: el("settingsDialog"), settingsAv: el("settingsAv"),
    settingsId: el("settingsId"), settingsName: el("settingsName")
  };

  /// The longest a purpose may be, as the store holds it.
  const MAX_PURPOSE = 256;

  const state = {
    channels: [],
    current: null,       // the channel being read, by name
    detail: null,        // its Channel, for state and purpose
    messages: [],        // what has been loaded, oldest first
    lastId: 0,           // the id the next poll asks after
    participants: [],
    name: null,          // the name half of this person's identity
    joined: new Set(),   // channels this page has already joined, so a reload
                         // is not a join message per visit
    // What a phone shows: the channels screen or the transcript screen, and
    // whether the participants sheet is over it. Both are classes on #app that
    // only the narrow layout reads, so a desk is unaffected.
    onChannels: false,
    sheet: false,
    collapsed: false,    // the participants panel, folded to its avatars
    // The channels pinned to the top of the rail, in their kept order.
    pins: [],
    // The settings this browser keeps: "system", "light" or "dark", and
    // whether a rail row carries the channel's purpose under its name.
    theme: "system",
    rows: "purpose",
    // Where the reading had got to when this channel was opened, so the "new"
    // rule stays put while it is read rather than walking down the transcript
    // as the cursor advances under it. `null` until the first draw that has
    // the participants to ask.
    newAt: null,
    // What is open over the page: the row menu, the palette, and whether the
    // purpose in the head has been turned into an input.
    menu: null,          // the channel name whose row menu is open
    palette: false,
    editingPurpose: false,
    // Bumped whenever the channel changes or a follower is restarted. A
    // follower whose generation is stale returns instead of rendering over
    // whatever is on screen now.
    generation: 0,
    // The read this page owes the person: the timer waiting for the newest
    // message to settle, and the highest id sent, so a burst is one call.
    readTimer: 0,
    readSent: 0,
    // The controller for the poll the current follower has in flight. A stale
    // follower that only returned would leave the server holding its request
    // for the rest of the minute, so the request is dropped as well as
    // ignored: that is what makes a hidden tab really hold nothing open.
    abort: null
  };

  /// What the machine is asking for. Watched rather than read once: somebody
  /// whose theme follows their machine should see the page turn over with
  /// everything else when the sun goes down, without reloading it.
  const systemDark = window.matchMedia
    ? window.matchMedia("(prefers-color-scheme: dark)")
    : { matches: false, addEventListener() {} };

  const enc = encodeURIComponent;
  const sleep = (ms) => new Promise((done) => setTimeout(done, ms));

  /// Ends the follower that is running, request and all, and hands back the
  /// generation the next one runs under. Everything that changes what the page
  /// is following goes through here, so nothing is ever left holding.
  function nextGeneration() {
    if (state.abort) state.abort.abort();
    state.abort = new AbortController();
    state.generation += 1;
    return state.generation;
  }

  function esc(text) {
    return String(text).replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  /// One request. A 204 is `null`, a failure is an Error carrying the
  /// server's own words, which are written to be read (there is no auth, so
  /// nothing is hidden).
  async function api(path, init) {
    const options = Object.assign({ headers: { "content-type": "application/json" } }, init || {});
    const response = await fetch(path, options);
    if (response.status === 204) return null;
    const text = await response.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (ignored) { data = null; }
    if (!response.ok) {
      const failure = new Error((data && data.error) || text || ("request failed: " + response.status));
      failure.status = response.status;
      throw failure;
    }
    return data;
  }

  // ---- drawing people -----------------------------------------------------

  function shortName(identityText) { return String(identityText).split("@")[0]; }
  function hostOf(identityText) { return String(identityText).split("@")[1] || ""; }

  function icon(id, cls) {
    return '<svg class="i ' + (cls || "") + '" aria-hidden="true"><use href="#' + id + '"></use></svg>';
  }

  /// The glyph for a harness, and the neutral one for a harness with none.
  function harnessIcon(harness, cls) {
    return icon(HARNESSES[harness] ? "h" + harness : "hx", cls);
  }
  function harnessLabel(harness) { return HARNESSES[harness] || harness || "unknown"; }

  /// A colour per host, hashed into the small palette. `web` is pinned to the
  /// first pair so the person posting from this page is always the same
  /// colour, whatever else is in the channel.
  function hostClass(host) {
    if (host === HOST) return "h0";
    let n = 0;
    for (let i = 0; i < host.length; i += 1) n = (n * 31 + host.charCodeAt(i)) >>> 0;
    return "h" + (1 + (n % 7));
  }

  /// The two letters that stand for a name. The first is the first letter of
  /// the distinguishing segment — `saneha-claude` and `saneha-copilot` are
  /// told apart by their last, not their shared first — and the second is the
  /// first letter that separates it from the others in this channel, so
  /// `Cl` and `Cp`. With nothing to separate it from, the first two letters.
  function monogram(name, everyone) {
    const tail = (n) => { const parts = String(n).split("-"); return parts[parts.length - 1] || String(n); };
    const me = tail(name).toLowerCase();
    const rest = everyone.filter((other) => other !== name).map((other) => tail(other).toLowerCase())
      .filter((other) => other[0] === me[0]);
    let at = 1;
    while (at < me.length && !rest.every((other) => other[at] !== me[at])) at += 1;
    if (at >= me.length) at = 1;
    return (me[0] || "?").toUpperCase() + (me[at] || me[1] || "");
  }

  function mono(name) {
    const everyone = state.participants.map((person) => person.name || shortName(person.identity));
    if (everyone.indexOf(name) < 0) everyone.push(name);
    return monogram(name, everyone);
  }

  function personOf(identityText) {
    return state.participants.find((person) => person.identity === identityText) || null;
  }

  /// One monogram tile. Away is dimmed and dashed as well as said in words.
  function avatar(identityText, cls) {
    const person = personOf(identityText);
    const away = person && person.away;
    return '<span class="av ' + (cls || "") + " " + (away ? "aw" : hostClass(hostOf(identityText))) +
      '" title="' + esc(identityText) + '">' + esc(mono(shortName(identityText))) + "</span>";
  }

  // ---- identity -----------------------------------------------------------

  /// The alphabet the server holds a name to: lowercase letters, digits and
  /// single hyphens. Folding here means the dialog shows what will be granted
  /// rather than the server refusing it a moment later.
  function slug(raw) {
    return String(raw).toLowerCase().replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "").slice(0, 64);
  }

  function identity() { return state.name ? state.name + "@" + HOST : null; }

  function showWho() {
    const me = identity();
    ui.whoId.textContent = me || "no name yet";
    ui.whoAv.innerHTML = me ? avatar(me, "md") : "";
    // Always the gear, whether or not there is a name yet. Settings are a
    // fixed place or they are not findable, and the first version of this
    // hid them behind having a name: somebody who came looking for the
    // settings found a button that said "set a name" and led somewhere else.
    // The chip beside it already says "no name yet", and setting one is the
    // first row inside.
    ui.who.innerHTML = icon("gr", "b");
    ui.composeHint.innerHTML = me
      ? 'Ctrl or Cmd with Enter sends · you post as <span class="mono">' + esc(me) + "</span>"
      : "Ctrl or Cmd with Enter sends";
  }

  // ---- what this browser keeps ---------------------------------------------

  /// Reading and writing one kept preference. Storage can be refused outright
  /// — a private window throws on the way in as well as on the way out — so
  /// every one of these falls back to the default rather than to an error.
  function kept(key, fallback) {
    try { return localStorage.getItem(key) || fallback; } catch (ignored) { return fallback; }
  }

  function keep(key, value, fallback) {
    try {
      if (value === fallback) localStorage.removeItem(key);
      else localStorage.setItem(key, value);
    } catch (ignored) { /* private window */ }
  }

  /// The theme applied. "system" is not a third palette: it is whichever of
  /// the two the machine is asking for, so it resolves here to the same
  /// attribute the head script stamped and the stylesheet reads.
  function applyTheme() {
    const dark = state.theme === "dark" || (state.theme === "system" && systemDark.matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.documentElement.style.colorScheme = dark ? "dark" : "light";
  }

  function setTheme(theme) {
    state.theme = theme;
    keep(THEME_KEY, theme, "system");
    applyTheme();
    drawSettings();
  }

  function setRows(rows) {
    state.rows = rows;
    keep(ROWS_KEY, rows, "purpose");
    if (rows === "name") document.documentElement.dataset.rows = "name";
    else delete document.documentElement.dataset.rows;
    drawSettings();
  }

  /// Which segment of each control is the one in force, and who is posting.
  function drawSettings() {
    for (const button of ui.settingsDialog.querySelectorAll("[data-theme-pick]")) {
      button.setAttribute("aria-pressed", button.dataset.themePick === state.theme);
    }
    for (const button of ui.settingsDialog.querySelectorAll("[data-rows-pick]")) {
      button.setAttribute("aria-pressed", button.dataset.rowsPick === state.rows);
    }
    const me = identity();
    ui.settingsId.textContent = me || "no name yet";
    ui.settingsAv.innerHTML = me ? avatar(me, "md") : "";
    ui.settingsName.innerHTML = icon("pn") + (me ? "change" : "set a name");
    ui.settingsName.classList.toggle("pri", !me);
  }

  function openSettings() {
    drawSettings();
    ui.settingsDialog.showModal();
  }

  function askName() {
    ui.nameInput.value = state.name || DEFAULT_NAME;
    const preview = () => {
      const name = slug(ui.nameInput.value);
      ui.namePreview.textContent = name ? "You will post as " + name + "@" + HOST : "A name is needed.";
    };
    preview();
    ui.nameInput.oninput = preview;
    ui.nameDialog.showModal();
    ui.nameInput.select();
    return new Promise((done) => {
      ui.nameDialog.onclose = () => {
        let took = false;
        if (ui.nameDialog.returnValue === "ok") {
          const name = slug(ui.nameInput.value);
          if (name) {
            state.name = name;
            took = true;
            try { localStorage.setItem(NAME_KEY, name); } catch (ignored) { /* private window */ }
          }
        }
        showWho();
        // The list is asked again as this person rather than as nobody: what
        // it carries about a channel — where they have read to in it — is a
        // different answer now, and it lights the badges as they watch rather
        // than at the next tick half a minute later.
        if (took) loadChannels();
        done(state.name);
      };
    });
  }

  async function ensureName() {
    if (state.name) return state.name;
    return await askName();
  }

  /// Joins the channel if this identity is not already in it and present.
  /// A join writes a system message and a resume writes one too, so the page
  /// looks at the participants it is already polling before it makes one.
  async function ensureJoined(channel) {
    if (state.joined.has(channel)) return;
    const mine = personOf(identity());
    if (mine && !mine.away) { state.joined.add(channel); return; }
    await api("/channels/" + enc(channel) + "/participants", {
      method: "POST",
      body: JSON.stringify({
        name: state.name, host: HOST, harness: HARNESS,
        same_host_session_live: false,
        // Resume semantics: the server refuses a join whose idea of who held
        // the identity is stale, so the page says what it last saw.
        held_session_id: (mine && mine.session_id) || undefined
      })
    });
    state.joined.add(channel);
  }

  // ---- channels -----------------------------------------------------------

  async function loadChannels() {
    try {
      // Who is asking, when this page knows: a server that carries per-channel
      // unread answers with this person's own read cursor, and one that does
      // not ignores the parameter and answers exactly as before.
      const me = identity();
      const data = await api("/channels" + (me ? "?as=" + enc(me) : ""));
      state.channels = data.channels || [];
      renderChannels();
    } catch (failure) {
      // A list that was right a moment ago is better than an error where the
      // channels were: this runs on every poll beat, and the follower's own
      // status line is where a server that has gone away is reported.
      if (!state.channels.length) {
        ui.channelList.innerHTML = '<p class="empty">' + esc(failure.message) + "</p>";
      }
    }
  }

  /// The unread badge. The channel list does not carry what a badge needs yet;
  /// when it carries `newest_id` and `read_cursor` this lights up with no
  /// other change here, and until then nothing is drawn rather than guessed.
  function behind(channel) {
    if (typeof channel.newest_id !== "number" || typeof channel.read_cursor !== "number") return 0;
    return Math.max(0, channel.newest_id - channel.read_cursor);
  }

  // ---- pinning ------------------------------------------------------------

  /// The pins this browser keeps, filtered to channels that still exist: a
  /// channel that was deleted elsewhere should not hold a place in the group.
  function pinned() {
    const names = new Set(state.channels.map((channel) => channel.name));
    return state.pins.filter((name) => names.has(name));
  }

  function isPinned(name) { return state.pins.indexOf(name) >= 0; }

  function setPinned(name, on) {
    const at = state.pins.indexOf(name);
    if (on && at < 0) state.pins.push(name);
    else if (!on && at >= 0) state.pins.splice(at, 1);
    else return;
    try { localStorage.setItem(PINS_KEY, JSON.stringify(state.pins)); } catch (ignored) { /* private window */ }
    renderChannels();
  }

  /// What was stored, taken as data and not as gospel: a hand-edited or
  /// half-written key leaves the rail unpinned rather than broken.
  function loadPins() {
    try {
      const kept = JSON.parse(localStorage.getItem(PINS_KEY) || "[]");
      state.pins = Array.isArray(kept) ? kept.filter((name) => typeof name === "string") : [];
    } catch (ignored) {
      state.pins = [];
    }
  }

  // ---- the channel list ---------------------------------------------------

  /// One row. The hash is the channel glyph and sits outside the name, so a
  /// name that is too long ellipsises without taking the mark with it; a
  /// closed channel has the hash struck through instead.
  function channelRow(channel, on) {
    const closed = channel.state === "closed";
    const unread = !closed && behind(channel) > 0;
    const cls = ["ch", on ? "on" : "", closed ? "cl" : "", unread ? "un" : ""].filter(Boolean).join(" ");
    const mark = closed ? icon("sk") : '<span class="hs">#</span>';
    const count = unread ? '<span class="bdg">' + behind(channel) + "</span>" : "";
    return '<div class="' + cls + '" data-channel="' + esc(channel.name) + '">' +
      mark +
      '<span class="cc"><button type="button" class="op" data-open="' + esc(channel.name) + '">' +
      '<span class="cn">' + esc(channel.name) + '</span>' +
      '<span class="cp">' + esc(channel.purpose || "no purpose") + "</span></button></span>" +
      count +
      '<button type="button" class="more2" data-menu="' + esc(channel.name) + '" aria-label="More for ' +
      esc(channel.name) + '">' + icon("dots") + "</button></div>";
  }

  function group(label, glyph) {
    return '<div class="grp">' + (glyph ? icon(glyph) : "") +
      "<span>" + label + '</span><span class="ln2"></span></div>';
  }

  function renderChannels() {
    if (!state.channels.length) {
      ui.channelList.innerHTML = '<p class="empty">No channels yet.</p>';
      return;
    }
    const by = new Map(state.channels.map((channel) => [channel.name, channel]));
    const pins = pinned();
    const kept = new Set(pins);
    // What is not pinned sorts itself: open first, then by name. What is
    // pinned keeps the order it was put in, which is the point of pinning.
    const rest = state.channels
      .filter((channel) => !kept.has(channel.name))
      .sort((a, b) => {
        if (a.state !== b.state) return a.state === "open" ? -1 : 1;
        return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
      });

    const html = [];
    if (pins.length) {
      html.push(group("Pinned", "pinf"));
      for (const name of pins) html.push(channelRow(by.get(name), name === state.current));
    }
    let heading = "";
    for (const channel of rest) {
      const want = channel.state === "closed" ? "Closed" : pins.length ? "Open" : "";
      if (want && want !== heading) { html.push(group(want)); heading = want; }
      html.push(channelRow(channel, channel.name === state.current));
    }
    ui.channelList.innerHTML = html.join("");
    for (const button of ui.channelList.querySelectorAll(".op")) {
      button.onclick = () => openChannel(button.dataset.open, true);
    }
    for (const button of ui.channelList.querySelectorAll(".more2")) {
      button.onclick = (event) => { event.stopPropagation(); rowMenu(button.dataset.menu, button); };
    }
  }

  // ---- the row menu -------------------------------------------------------

  /// Everything floating over the page closes the same way, so there is one
  /// place that puts it away and one veil that catches the click outside.
  function closeOver() {
    state.menu = null;
    state.palette = false;
    const open = document.querySelector(".pop");
    if (open) open.remove();
    ui.palette.hidden = true;
    ui.veil.hidden = true;
    for (const row of ui.channelList.querySelectorAll(".ch.menu")) row.classList.remove("menu");
  }

  /// The menu on one channel's row: pin or unpin, the name to paste into a
  /// message somewhere else, and close — which is why this exists at all, so
  /// that closing a channel no longer means opening it first.
  function rowMenu(name, anchor) {
    const already = state.menu === name;
    closeOver();
    if (already) return;

    const channel = state.channels.find((each) => each.name === name);
    if (!channel) return;
    const on = isPinned(name);
    const closed = channel.state === "closed";

    const pop = document.createElement("div");
    pop.className = "pop";
    pop.innerHTML =
      '<button type="button" class="mi" data-do="pin">' + icon(on ? "pinf" : "pin") +
      (on ? "Unpin channel" : "Pin channel") + "</button>" +
      '<button type="button" class="mi" data-do="copy">' + icon("cp") +
      '<span class="sub">#' + esc(name) + "</span></button>" +
      (closed ? "" : '<div class="msep"></div><button type="button" class="mi dg" data-do="close">' +
        icon("sk") + "Close channel</button>");
    document.body.append(pop);

    // Placed against the handle, and pulled back inside the window when the
    // row is near an edge. Fixed positioning, so a scrolled rail does not
    // leave the menu behind.
    const box = anchor.getBoundingClientRect();
    const size = pop.getBoundingClientRect();
    const left = Math.min(box.right - size.width, window.innerWidth - size.width - 8);
    const top = box.bottom + size.height + 8 > window.innerHeight
      ? Math.max(8, box.top - size.height - 4)
      : box.bottom + 4;
    pop.style.left = Math.max(8, left) + "px";
    pop.style.top = top + "px";

    state.menu = name;
    ui.veil.hidden = false;
    const row = ui.channelList.querySelector('.ch[data-channel="' + CSS.escape(name) + '"]');
    if (row) row.classList.add("menu");

    pop.querySelector('[data-do="pin"]').onclick = () => { setPinned(name, !on); closeOver(); };
    pop.querySelector('[data-do="copy"]').onclick = () => {
      // Clipboard access can be refused, and a refusal here is not worth a
      // message: the name is on the row the menu is attached to.
      if (navigator.clipboard) navigator.clipboard.writeText("#" + name).catch(() => {});
      closeOver();
    };
    const end = pop.querySelector('[data-do="close"]');
    if (end) end.onclick = () => { closeOver(); closeChannel(name); };
    pop.querySelector(".mi").focus();
  }

  // ---- jumping to a channel -----------------------------------------------

  /// The whole channel list is already in hand, so this filters what is here
  /// rather than asking the server anything. Closed channels are in it: they
  /// are the ones whose name is hardest to remember.
  function paletteMatches() {
    const typed = ui.paletteInput.value.trim().toLowerCase();
    const scored = [];
    for (const channel of state.channels) {
      const name = channel.name.toLowerCase();
      const purpose = (channel.purpose || "").toLowerCase();
      const at = name.indexOf(typed);
      const inPurpose = typed && at < 0 && purpose.indexOf(typed) >= 0;
      if (typed && at < 0 && !inPurpose) continue;
      // A name that starts with what was typed first, then a name that
      // contains it, then a purpose that does; pinned above unpinned, and
      // open above closed, inside each of those.
      const rank = (!typed ? 3 : at === 0 ? 0 : at > 0 ? 1 : 2) * 100 +
        (isPinned(channel.name) ? 0 : 10) + (channel.state === "closed" ? 5 : 0);
      scored.push({ channel: channel, at: at, rank: rank });
    }
    scored.sort((a, b) => a.rank - b.rank || (a.channel.name < b.channel.name ? -1 : 1));
    return scored.slice(0, 40);
  }

  /// The typed run marked inside the name, with everything escaped first so
  /// no part of a channel name can become an element.
  function marked(name, at, length) {
    if (at < 0 || !length) return esc(name);
    return esc(name.slice(0, at)) + "<mark>" + esc(name.slice(at, at + length)) +
      "</mark>" + esc(name.slice(at + length));
  }

  function renderPalette(selected) {
    const matches = paletteMatches();
    if (!matches.length) {
      ui.paletteList.innerHTML = '<p id="paletteEmpty">No channel matches that.</p>';
      return matches;
    }
    const length = ui.paletteInput.value.trim().length;
    const at = Math.min(selected, matches.length - 1);
    ui.paletteList.innerHTML = matches.map((match, index) => {
      const channel = match.channel;
      const closed = channel.state === "closed";
      const count = !closed && behind(channel) > 0 ? '<span class="bdg">' + behind(channel) + "</span>" : "";
      return '<button type="button" class="pi2" role="option" aria-selected="' + (index === at) +
        '" data-open="' + esc(channel.name) + '"><span class="pnm">' +
        (closed ? '<span class="hs">' + icon("sk") + "</span>" : '<span class="hs">#</span>') +
        marked(channel.name, match.at, length) + "</span>" +
        '<span class="pcp">' + esc(channel.purpose || "no purpose") + "</span>" +
        (closed ? '<span class="st cl">closed</span>' : count) + "</button>";
    }).join("");
    for (const button of ui.paletteList.querySelectorAll(".pi2")) {
      button.onclick = () => { closeOver(); openChannel(button.dataset.open, true); };
    }
    const chosen = ui.paletteList.querySelector('[aria-selected="true"]');
    if (chosen) chosen.scrollIntoView({ block: "nearest" });
    return matches;
  }

  let paletteAt = 0;

  function openPalette() {
    closeOver();
    state.palette = true;
    paletteAt = 0;
    ui.paletteInput.value = "";
    ui.palette.hidden = false;
    ui.veil.hidden = false;
    renderPalette(0);
    ui.paletteInput.focus();
  }

  // ---- the transcript -----------------------------------------------------

  /// A body as markdown, minimally and safely: everything is escaped before
  /// anything is marked up, so no part of a body can become an element. What
  /// is supported is what agents write: fenced blocks, code spans, paragraphs,
  /// and the mentions the server resolved for us.
  function renderBody(text, mentionable) {
    const lines = String(text).split("\n");
    let html = "";
    let paragraph = [];
    let code = null;   // the lines of a fenced block, while one is open

    const flush = () => {
      if (!paragraph.length) return;
      html += "<p>" + paragraph.map((line) => inline(line, mentionable)).join("<br>") + "</p>";
      paragraph = [];
    };
    for (const line of lines) {
      if (line.trimStart().startsWith("```")) {
        if (code) { html += "<pre><code>" + esc(code.join("\n")) + "</code></pre>"; code = null; }
        else { flush(); code = []; }
        continue;
      }
      if (code) { code.push(line); continue; }
      if (!line.trim()) { flush(); continue; }
      paragraph.push(line);
    }
    // A fence nobody closed is still code: that is what it was being written
    // as, and rendering the rest as prose would find mentions in it.
    if (code) html += "<pre><code>" + esc(code.join("\n")) + "</code></pre>";
    flush();
    return html;
  }

  /// One line: code spans are code, and only what is left is prose that can
  /// hold a mention. Splitting on backticks first is what keeps `@types/node`
  /// inside a span from being lit up.
  function inline(line, mentionable) {
    const pieces = line.split("`");
    const balanced = pieces.length % 2 === 1;
    let html = "";
    let previousWasProse = false;
    pieces.forEach((piece, index) => {
      const isCode = index % 2 === 1 && (balanced || index < pieces.length - 1);
      if (isCode) {
        html += "<code>" + esc(piece) + "</code>";
        previousWasProse = false;
      } else {
        // A backtick that opened nothing is a backtick.
        if (index > 0 && previousWasProse) html += "`";
        html += mentions(esc(piece), mentionable);
        previousWasProse = true;
      }
    });
    return html;
  }

  /// Lights up the `@name` mentions that really addressed somebody. The server
  /// resolved the recipients when the message was written, so the page marks
  /// what it can match against them rather than guessing at its own rules;
  /// `@all` is expanded by the server, so it is recognised by name.
  function mentions(escaped, mentionable) {
    // A mention runs to the end of a name, so a full stop after one is a full
    // stop; a slash after one is a package scope, and `@types/node` in prose
    // is not somebody being addressed.
    return escaped.replace(/(^|\s)@([a-z0-9-]+(?:@[a-z0-9-]+)?)(?![\w/-])/gi, (whole, before, who) => {
      if (!mentionable.has(who.toLowerCase())) return whole;
      return before + '<span class="mention">@' + who + "</span>";
    });
  }

  /// Every name a mention in this message could have used: each recipient's
  /// short name and full identity, plus `all`, which the server expanded into
  /// those recipients on the way in.
  function mentionable(message) {
    const names = new Set();
    if (message.recipients && message.recipients.length) names.add("all");
    for (const recipient of message.recipients || []) {
      names.add(recipient.toLowerCase());
      names.add(recipient.split("@")[0].toLowerCase());
    }
    return names;
  }

  function when(created) {
    const at = new Date(created);
    if (isNaN(at)) return { text: created, title: created, day: created };
    return {
      text: at.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
      title: created + " (UTC)",
      day: at.toDateString()
    };
  }

  /// What a day divider says: today and yesterday by name, anything else by
  /// its date.
  function dayLabel(day) {
    const today = new Date();
    if (day === today.toDateString()) return "Today";
    const before = new Date(today.getTime() - 86400000);
    if (day === before.toDateString()) return "Yesterday";
    const at = new Date(day);
    return isNaN(at) ? day : at.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
  }

  function size(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KiB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MiB";
  }

  function divider(label, kind) {
    return '<div class="dv ' + (kind || "") + '"><span>' + label + "</span></div>";
  }

  /// The read cursors sitting on one message, as a cluster of monograms in the
  /// margin. The names are on the cluster rather than in the transcript, so a
  /// channel with eight participants does not grow eight rules through it.
  function cluster(here) {
    if (!here || !here.length) return '<div class="m"></div>';
    const names = here.map(shortName);
    const title = names.join(", ") + (names.length > 1 ? " have" : " has") + " read to here";
    // Two fit in the margin; the rest are a count, and the line names them all.
    const shown = here.slice(0, 2);
    return '<div class="m" title="' + esc(title) + '"><span class="ln"></span>' +
      shown.map((who) => avatar(who, "s")).join("") +
      (here.length > shown.length ? '<span class="more">+' + (here.length - shown.length) + "</span>" : "") +
      "</div>";
  }

  function renderTranscript() {
    if (!state.current) return;
    // Follow the end of the transcript only for a reader who is already there,
    // so a live message never yanks somebody out of the history they scrolled
    // back to.
    const box = ui.transcript;
    const follow = atEnd();

    if (!state.messages.length) {
      box.innerHTML = '<p class="empty">Nothing in this transcript yet.</p>';
      return;
    }

    // Read cursors, grouped by the message they sit on: one cluster per
    // position, however many participants share it.
    const readers = new Map();
    for (const person of state.participants) {
      if (!person.read_cursor) continue;
      const at = readers.get(person.read_cursor) || [];
      at.push(person.identity);
      readers.set(person.read_cursor, at);
    }

    // Where the reading had got to when this channel was opened. Taken once,
    // not on every draw: the cursor advances under the rule as it is read, and
    // a rule that followed it would walk down the transcript while somebody
    // was looking at it.
    const me = personOf(identity());
    if (state.newAt === null && me) state.newAt = me.read_cursor || 0;

    const html = [];
    let day = "";
    let previous = null;
    let ruled = false;
    for (const message of state.messages) {
      const at = when(message.created_at);
      if (at.day !== day) {
        html.push(divider(esc(dayLabel(at.day))));
        day = at.day;
        previous = null;
      }
      // The rule goes in front of the first message this person had not read
      // when they arrived, and only when there was something to read: a
      // channel opened up to date has no rule in it.
      if (!ruled && state.newAt > 0 && message.id > state.newAt) {
        html.push('<div class="dv new" id="newRule"><span class="nw">new</span>' +
          '<span class="at2">read to #' + state.newAt + "</span></div>");
        ruled = true;
        previous = null;
      }
      if (message.kind === "message") {
        // Consecutive messages from one sender are one header and stacked
        // bodies: an agent writing three in a row is one voice, not three.
        const grouped = !!previous && previous.kind === "message" && previous.from === message.from;
        html.push(renderMessage(message, at, grouped, readers.get(message.id)));
      } else {
        html.push(renderSystem(message, at, readers.get(message.id)));
      }
      previous = message;
    }
    if (me && state.lastId > 0 && me.read_cursor >= state.lastId) {
      html.push(divider(icon("tk") + "you are caught up", "up"));
    }
    box.innerHTML = html.join("");
    if (follow) box.scrollTop = box.scrollHeight;
    showJumpNew();
  }

  /// The pill over the transcript, which is only worth drawing when the rule
  /// it jumps to is off screen: with the rule in view it would be pointing at
  /// something the reader is already looking at.
  function showJumpNew() {
    const rule = document.getElementById("newRule");
    if (!rule) { ui.jumpNew.hidden = true; return; }
    const box = ui.transcript.getBoundingClientRect();
    const at = rule.getBoundingClientRect();
    const seen = at.bottom > box.top && at.top < box.bottom;
    ui.jumpNew.hidden = seen;
    if (seen) return;
    const count = state.messages.filter((message) => message.id > state.newAt).length;
    ui.jumpNew.innerHTML = count + (count === 1 ? " new message" : " new messages") +
      '<span class="rnd">' + icon("dn") + "</span>";
  }

  /// Whether the transcript is scrolled to its end, within a little slack.
  function atEnd() {
    const box = ui.transcript;
    return box.scrollHeight - box.scrollTop - box.clientHeight < AT_END;
  }

  /// Who a message went to: the names, ellipsised after three, with the whole
  /// list on the line. No recipients is everyone.
  function toWhom(message) {
    const to = message.recipients || [];
    if (!to.length) return '<span class="to">to everyone</span>';
    const names = to.map(shortName);
    const shown = names.slice(0, 3).join(", ") + (names.length > 3 ? " +" + (names.length - 3) : "");
    return '<span class="to" title="' + esc(to.join(", ")) + '">to <b>' + esc(shown) + "</b></span>";
  }

  function renderMessage(message, at, grouped, here) {
    const from = message.from || "?";
    const person = personOf(from);
    const stamp = '<span class="tm" title="' + esc(at.title) + '">' + esc(at.text) + " · #" + message.id + "</span>";
    const head = grouped
      ? '<span class="sp"></span>' + stamp
      : '<span class="nm">' + esc(shortName(from)) + "</span>" +
        harnessIcon(person ? person.harness : "", "hg") +
        '<span class="hs">@' + esc(hostOf(from)) + "</span>" + toWhom(message) +
        // A narrow screen folds the header here: who and when, then where
        // from and to whom.
        '<span class="sp"></span>' + stamp + '<i class="br"></i>';
    const files = (message.attachments || []).map((attachment) => (
      '<a class="att" href="/channels/' + enc(message.channel) + "/attachments/" + enc(attachment.id) +
      '">' + icon("fi") + esc(attachment.filename) + ' <span class="sz">' + esc(size(attachment.size)) + "</span></a>"
    )).join("");
    return '<div class="r' + (grouped ? " cont" : "") + '"><div class="g">' +
      (grouped ? "" : avatar(from)) + '</div><div class="c"><div class="hd">' + head + "</div>" +
      '<div class="bd">' + renderBody(message.body, mentionable(message)) + "</div>" +
      (files ? '<div class="at">' + files + "</div>" : "") + "</div>" + cluster(here) + "</div>";
  }

  /// A system line: the server's kind picks the glyph, and the identity it is
  /// about is set in the identity face while the rest of the sentence is not.
  function renderSystem(message, at, here) {
    const body = String(message.body || "");
    const about = message.about || body.split(" ")[0];
    const glyph = message.kind === "close" ? "sk" : message.kind === "leave" ? "out" : "in";
    const who = body.startsWith(about) ? about : "";
    const rest = body.slice(who.length);
    return '<div class="r sy"><div class="g">' + icon(glyph) + '</div><div class="c">' +
      '<span><span class="mono">' + esc(who) + "</span>" + esc(rest) + "</span>" +
      '<span class="sp"></span><span class="tm" title="' + esc(at.title) + '">' +
      esc(at.text) + " · #" + message.id + "</span></div>" + cluster(here) + "</div>";
  }

  function renderPeople() {
    if (!state.participants.length) {
      ui.people.innerHTML = '<p class="empty">Nobody has joined.</p>';
      ui.peopleFoot.textContent = "";
      return;
    }
    const me = identity();
    ui.people.innerHTML = state.participants.map((person) => {
      const behind = state.lastId - person.read_cursor;
      const caught = state.lastId > 0 && behind <= 0;
      const read = !person.read_cursor
        ? icon("ck") + "read nothing"
        : (caught ? icon("tk") : icon("ck")) + "read #" + person.read_cursor +
          (behind > 0 ? " · " + behind + " behind" : "");
      return '<div class="p' + (person.away ? " away" : "") + (person.identity === me ? " me" : "") + '">' +
        avatar(person.identity, "md") + '<div class="pi"><div class="pn">' + esc(person.name) +
        (person.identity === me ? ' <span class="you">you</span>' : "") + "</div>" +
        '<div class="ph2">@' + esc(person.host) + "</div>" +
        '<div class="pf">' + harnessIcon(person.harness) + esc(harnessLabel(person.harness)) +
        (person.away ? '<span class="tag">away</span>' : "") + "</div>" +
        '<div class="pr' + (caught ? " ok" : "") + '">' + read + "</div></div></div>";
    }).join("");
    ui.peopleFoot.innerHTML = state.lastId
      ? 'newest in this transcript is <span class="mono">#' + state.lastId + "</span>"
      : "nothing in this transcript yet";
  }

  /// The avatar row in the channel head, and the chip saying how many of the
  /// participants have read to the newest message.
  function renderHead() {
    const people = state.participants;
    const shown = people.slice(0, 4);
    ui.heads.innerHTML = shown.map((person) => avatar(person.identity, "md")).join("") +
      (people.length > shown.length ? '<span class="more">+' + (people.length - shown.length) + "</span>" : "");
    const caught = state.lastId > 0
      ? people.filter((person) => person.read_cursor >= state.lastId).length
      : 0;
    const text = icon("tk") + caught + " of " + people.length + " caught up";
    ui.caught.innerHTML = text;
    ui.caught2.innerHTML = text;
    ui.caught.hidden = ui.caught2.hidden = !people.length;
  }

  /// Everything about the channel being read, drawn from what is in hand.
  function draw() {
    renderChannelHead();
    renderHead();
    renderPeople();
    renderTranscript();
    renderChannels();
  }

  function renderChannelHead() {
    const closed = state.detail && state.detail.state === "closed";
    // The hash is the channel glyph here as well as in the rail, and it is
    // quieter than the name: it says what this is, the name says which.
    ui.channelName.innerHTML = state.current
      ? '<span class="hs">#</span>' + esc(state.current)
      : "no channel";
    renderPurpose(closed);
    ui.channelState.hidden = !state.detail;
    if (state.detail) {
      ui.channelState.textContent = state.detail.state;
      ui.channelState.classList.toggle("cl", closed);
    }
    ui.closeChannel.hidden = ui.closeChannel2.hidden = !state.current || closed;
    ui.banner.hidden = !closed;
    if (closed) {
      // The channel carries when it was closed, so the banner says it without
      // hunting through the transcript for the close message.
      const at = state.detail.closed_at ? when(state.detail.closed_at) : null;
      ui.banner.textContent = at
        ? "This channel was closed at " + at.text + ". It takes no more messages and is here to be read."
        : "This channel is closed. It takes no more messages and is here to be read.";
      ui.banner.title = at ? at.title : "";
    }
    ui.compose.hidden = !state.current || closed;
  }

  /// The purpose, as a control. A channel with none says so in a way that
  /// invites the line rather than leaving a gap, which is also how a purpose
  /// gets onto the channels the server minted names for.
  ///
  /// A closed channel is not editable: it is the record of a conversation that
  /// is over, and what it said it was for is part of that record.
  function renderPurpose(closed) {
    if (state.editingPurpose) return;
    const purpose = (state.detail && state.detail.purpose) || "";
    ui.purposeRow.hidden = !state.current;
    ui.purposeEdit.hidden = true;
    ui.channelPurpose.textContent = purpose || (closed ? "" : "say what this channel is for");
    ui.channelPurpose.classList.toggle("none", !purpose && !closed);
    ui.channelPurpose.disabled = !!closed;
    ui.channelPurpose.title = closed
      ? "A closed channel keeps the purpose it had"
      : purpose ? "Edit the purpose" : "Say what this channel is for";
    el("purposeEditBtn").hidden = !!closed;
  }

  function startPurposeEdit() {
    if (!state.current || (state.detail && state.detail.state === "closed")) return;
    state.editingPurpose = true;
    ui.purposeRow.hidden = true;
    ui.purposeEdit.hidden = false;
    ui.purposeInput.value = (state.detail && state.detail.purpose) || "";
    countPurpose();
    ui.purposeInput.focus();
    ui.purposeInput.select();
  }

  function stopPurposeEdit() {
    state.editingPurpose = false;
    renderPurpose(state.detail && state.detail.state === "closed");
  }

  function countPurpose() {
    const length = [...ui.purposeInput.value].length;
    ui.purposeCount.textContent = length + "/" + MAX_PURPOSE;
    ui.purposeCount.classList.toggle("over", length > MAX_PURPOSE);
  }

  /// Saves the line, as this person. A purpose that has not changed is not
  /// sent at all, so pressing enter over an untouched line is free.
  async function savePurpose() {
    const purpose = ui.purposeInput.value.trim();
    const before = (state.detail && state.detail.purpose) || "";
    if (purpose === before) { stopPurposeEdit(); return; }
    if ([...purpose].length > MAX_PURPOSE) return;
    const channel = state.current;
    try {
      if (!(await ensureName())) return;
      const updated = await api("/channels/" + enc(channel), {
        method: "PATCH",
        body: JSON.stringify({ by: identity(), purpose: purpose || null })
      });
      if (state.current !== channel) return;
      state.detail = updated;
      // The listing carries the purpose too, and the rail is showing the old
      // one until something says otherwise.
      const listed = state.channels.find((each) => each.name === channel);
      if (listed) listed.purpose = updated.purpose;
      stopPurposeEdit();
      renderChannels();
    } catch (failure) {
      ui.status.textContent = failure.message;
    }
  }

  // ---- the two screens a phone has ----------------------------------------

  function showChannels(on) {
    state.onChannels = on;
    ui.app.classList.toggle("vc", on);
  }

  function showSheet(on) {
    state.sheet = on;
    ui.app.classList.toggle("vs", on);
  }

  function collapse(on) {
    state.collapsed = on;
    ui.panel.classList.toggle("col", on);
    try { localStorage.setItem(PANEL_KEY, on ? "1" : "0"); } catch (ignored) { /* private window */ }
  }

  // ---- following a channel ------------------------------------------------

  function openChannel(name, push) {
    const generation = nextGeneration();
    closeOver();
    state.editingPurpose = false;
    state.newAt = null;
    ui.jumpNew.hidden = true;
    state.current = name;
    state.detail = null;
    state.messages = [];
    state.lastId = 0;
    state.participants = [];
    clearTimeout(state.readTimer);
    state.readSent = 0;
    ui.sendError.textContent = "";
    ui.transcript.innerHTML = '<p class="empty">Loading…</p>';
    showChannels(false);
    showSheet(false);
    renderChannels();
    renderChannelHead();
    renderHead();
    renderPeople();
    if (push) history.pushState({ channel: name }, "", "/c/" + enc(name));
    document.title = name + " · saneha";
    follow(name, generation, state.abort.signal);
  }

  /// Restarts the follower on the channel already open, from the last id it
  /// has: what a tab coming back into view does, and what a poll that failed
  /// does after its backoff.
  function resume() {
    if (!state.current) return;
    const generation = nextGeneration();
    follow(state.current, generation, state.abort.signal);
  }

  async function refreshSide(channel, signal) {
    const [detail, people] = await Promise.all([
      api("/channels/" + enc(channel), { signal }),
      api("/channels/" + enc(channel) + "/participants", { signal })
    ]);
    state.detail = detail.channel || detail;
    state.participants = people.participants || [];
  }

  /// History to the end, then one long poll after another.
  ///
  /// The poll is `GET /channels/{c}/messages?after=<last id>&hold=55`: no
  /// identity, no read cursor, nothing moved. The server answers with the
  /// messages when any land, or 204 when the hold elapses, and either way the
  /// next request goes out at once, so a message appears here about as fast as
  /// it appears in a CLI `wait`.
  async function follow(channel, generation, signal) {
    let backoff = FIRST_BACKOFF;
    // Whether this run has caught up and drawn once. Every run does, before it
    // holds anything open: a follower started by a close, by a tab coming back
    // or by a failed poll would otherwise show what was true a minute ago
    // until its own poll came back.
    let caughtUp = false;
    const stale = () => generation !== state.generation || channel !== state.current;

    while (!stale()) {
      try {
        if (document.hidden) { ui.status.textContent = "Paused while this tab is in the background."; return; }

        if (!caughtUp) {
          // History, a page at a time, until the end of the transcript — and
          // nothing at all when this run is picking up where another left off.
          for (;;) {
            const data = await api(
              "/channels/" + enc(channel) + "/messages?after=" + state.lastId + "&limit=" + PAGE,
              { signal }
            );
            if (stale()) return;
            const got = data.messages || [];
            take(got);
            if (got.length < PAGE) break;
          }
          await refreshSide(channel, signal);
          if (stale()) return;
          draw();
          caughtUp = true;
          scheduleRead();   // what is on screen is what is being read
        }

        if (state.detail && state.detail.state === "closed") {
          ui.status.textContent = "This channel is closed; nothing more will arrive.";
          return;
        }
        ui.status.textContent = "";

        const data = await api(
          "/channels/" + enc(channel) + "/messages?after=" + state.lastId + "&hold=" + HOLD,
          { signal }
        );
        if (stale()) return;
        // The poll came back, so the server is there: the next failure starts
        // over at a second rather than where the last run of failures left off.
        backoff = FIRST_BACKOFF;
        // Null is the 204 that ends a hold: either it elapsed, or something
        // changed that was not a message — a read cursor moved — and either
        // way what follows is the look that shows it.
        if (data) take(data.messages || []);
        // Cursors move without a message being written, and channels are
        // created, closed and deleted from other machines, so the panel and
        // the left column are refreshed on the same beat as the poll.
        await refreshSide(channel, signal);
        if (stale()) return;
        draw();
        await loadChannels();
      } catch (failure) {
        if (stale()) return;
        if (failure.status === 404) {
          ui.status.textContent = "";
          ui.transcript.innerHTML = '<p class="empty">' + esc(failure.message) + "</p>";
          state.current = null;
          renderChannelHead();
          loadChannels();
          return;
        }
        ui.status.textContent = failure.message + " — trying again in " + Math.round(backoff / 1000) + "s.";
        await sleep(backoff);
        // Only here: a run of failures backs off further each time, and it is
        // a poll that came back which says the server is worth asking quickly
        // again.
        backoff = Math.min(backoff * 2, BACKOFF_MAX);
      }
    }
  }

  /// Adds a page of messages, keeping the transcript ordered and the id the
  /// next poll asks after.
  function take(messages) {
    const before = state.lastId;
    for (const message of messages) {
      if (message.id <= state.lastId) continue;
      state.messages.push(message);
      state.lastId = message.id;
    }
    // A new newest message starts its seconds on screen again: a burst is one
    // read, at the end of it.
    if (state.lastId !== before) scheduleRead();
  }

  // ---- reading for the person ---------------------------------------------

  /// Starts the wait before this page reads for the person, restarting one
  /// already waiting.
  function scheduleRead() {
    clearTimeout(state.readTimer);
    state.readTimer = setTimeout(readToEnd, SETTLE);
  }

  /// Moves this person's read cursor to the newest message, under one rule:
  /// the tab is visible, the transcript is scrolled to its end, and the newest
  /// message has been there for SETTLE. Only a read moves a cursor (ADR-0004),
  /// and this is a person having read what was in front of them, over the
  /// route `saneha read` calls. So nothing for a hidden tab, nothing for a
  /// reader scrolled back, nothing for somebody who has not joined.
  async function readToEnd() {
    state.readTimer = null;
    const channel = state.current;
    const me = identity();
    if (!channel || !me || document.hidden || !atEnd()) return;
    const mine = personOf(me);
    if (!mine) return;
    const newest = state.lastId;
    if (!newest || newest <= state.readSent || newest <= mine.read_cursor) return;

    state.readSent = newest;
    try {
      const moved = await api(
        "/channels/" + enc(channel) + "/participants/" + enc(me) + "/cursor",
        { method: "POST", body: JSON.stringify({ read_cursor: newest }) }
      );
      if (!moved || channel !== state.current) return;
      // The poll brings this back anyway — the server wakes a channel for a
      // cursor — but drawing it now moves the person's own marker as they
      // watch.
      const at = state.participants.findIndex((person) => person.identity === me);
      if (at >= 0) state.participants[at] = moved;
      draw();
    } catch (ignored) {
      // A cursor that did not move is not worth interrupting a reader over;
      // the next message, or the next settling, tries again.
      state.readSent = 0;
    }
  }

  // ---- posting ------------------------------------------------------------

  async function send() {
    const body = ui.body.value;
    if (!body.trim() || !state.current) return;
    // A key per post: a send made again is one message (issue #38).
    const key = [...crypto.getRandomValues(new Uint8Array(16))].map((b) => b.toString(16).padStart(2, "0")).join("");
    ui.sendError.textContent = "";
    try {
      if (!(await ensureName())) return;
      await ensureJoined(state.current);
      await api("/channels/" + enc(state.current) + "/messages", {
        method: "POST",
        body: JSON.stringify({ from: identity(), body: body, key })
      });
      ui.body.value = "";
      // Nothing is added here: the poll in flight is woken by this send and
      // brings the message back the same way it brings anyone else's.
    } catch (failure) {
      // The server's words, which say what to do about an unknown mention or
      // an ambiguous one.
      ui.sendError.textContent = failure.message;
    }
  }

  /// Closes a channel, which is now reachable from the row menu as well as
  /// from the head of the one being read — so closing something no longer
  /// means opening it first.
  async function closeChannel(name) {
    if (!name) return;
    if (!(await ensureName())) return;
    if (!confirm("Close #" + name + "? It takes no more messages afterwards, and every wait on it ends.")) return;
    try {
      await api("/channels/" + enc(name) + "/close", {
        method: "POST",
        body: JSON.stringify({ by: identity() })
      });
      showSheet(false);
      await loadChannels();
      // Only the channel being read has a follower to restart; closing one
      // from its row leaves the transcript on screen where it was.
      if (name === state.current) resume();
    } catch (failure) {
      ui.status.textContent = failure.message;
    }
  }

  async function createChannel() {
    ui.newName.value = "";
    ui.newPurpose.value = "";
    ui.newError.textContent = "";
    ui.channelDialog.showModal();
    ui.channelDialog.onclose = async () => {
      if (ui.channelDialog.returnValue !== "ok") return;
      const name = ui.newName.value.trim();
      const purpose = ui.newPurpose.value.trim();
      try {
        const channel = await api("/channels", {
          method: "POST",
          body: JSON.stringify({ name: name || undefined, purpose: purpose || undefined })
        });
        await loadChannels();
        openChannel(channel.name, true);
      } catch (failure) {
        ui.newError.textContent = failure.message;
        ui.channelDialog.showModal();
      }
    };
  }

  // ---- wiring -------------------------------------------------------------

  ui.compose.addEventListener("submit", (event) => { event.preventDefault(); send(); });
  ui.body.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) { event.preventDefault(); send(); }
  });
  ui.who.onclick = openSettings;
  ui.settingsName.onclick = () => { ui.settingsDialog.close(); askName(); };
  for (const button of ui.settingsDialog.querySelectorAll("[data-theme-pick]")) {
    button.onclick = () => setTheme(button.dataset.themePick);
  }
  for (const button of ui.settingsDialog.querySelectorAll("[data-rows-pick]")) {
    button.onclick = () => setRows(button.dataset.rowsPick);
  }
  systemDark.addEventListener("change", () => { if (state.theme === "system") applyTheme(); });
  ui.closeChannel.onclick = () => closeChannel(state.current);
  ui.closeChannel2.onclick = () => closeChannel(state.current);

  // the purpose, edited in place
  ui.channelPurpose.onclick = startPurposeEdit;
  el("purposeEditBtn").onclick = startPurposeEdit;
  ui.purposeInput.addEventListener("input", countPurpose);
  ui.purposeInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") { event.preventDefault(); savePurpose(); }
    if (event.key === "Escape") { event.preventDefault(); stopPurposeEdit(); }
  });
  // Leaving the line alone is cancelling it, not saving it: a purpose is a
  // deliberate edit, and clicking away is how somebody changes their mind.
  ui.purposeInput.addEventListener("blur", () => { if (state.editingPurpose) stopPurposeEdit(); });

  // jumping to a channel
  el("jump").onclick = openPalette;
  ui.veil.onclick = closeOver;
  ui.paletteInput.addEventListener("input", () => { paletteAt = 0; renderPalette(0); });
  ui.paletteInput.addEventListener("keydown", (event) => {
    const matches = paletteMatches();
    if (event.key === "ArrowDown" || event.key === "ArrowUp") {
      event.preventDefault();
      if (!matches.length) return;
      paletteAt = (paletteAt + (event.key === "ArrowDown" ? 1 : matches.length - 1)) % matches.length;
      renderPalette(paletteAt);
    } else if (event.key === "Enter") {
      event.preventDefault();
      const chosen = matches[Math.min(paletteAt, matches.length - 1)];
      if (chosen) { closeOver(); openChannel(chosen.channel.name, true); }
    } else if (event.key === "Escape") {
      event.preventDefault();
      closeOver();
    }
  });

  // One key opens the palette and one key puts away whatever is over the
  // page. Neither fires while something is being typed into, so ⌘K in the
  // compose box is still whatever the browser does with it.
  document.addEventListener("keydown", (event) => {
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
    if ((event.metaKey || event.ctrlKey) && (event.key === "k" || event.key === "K")) {
      event.preventDefault();
      openPalette();
      return;
    }
    if (event.key === "Escape" && (state.menu || state.palette)) { closeOver(); return; }
    if (event.key === "/" && !typing && !state.palette) { event.preventDefault(); openPalette(); }
  });

  // the pill over the transcript, and the rule it points at
  ui.jumpNew.onclick = () => {
    const rule = document.getElementById("newRule");
    if (rule) rule.scrollIntoView({ block: "center", behavior: "smooth" });
  };
  el("newChannel").onclick = createChannel;
  el("toChannels").onclick = () => showChannels(true);
  // The avatar row opens the sheet on a phone and unfolds the panel on a desk;
  // each is a no-op in the other layout.
  ui.heads.onclick = () => { showSheet(true); collapse(false); };
  el("panelToggle").onclick = () => collapse(!state.collapsed);
  el("sheetClose").onclick = () => showSheet(false);
  el("scrim").onclick = () => showSheet(false);

  // A background tab holds no poll open: the server has better things to do
  // than hold a minute per forgotten tab, and coming back is one request. The
  // poll in flight is dropped rather than merely ignored, so the server stops
  // holding it the moment the tab goes away.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { resume(); scheduleRead(); }
    else nextGeneration();
  });

  // The other half of the read rule: scrolling back stops the reading while
  // they are back there, and returning to the end starts it again.
  ui.transcript.addEventListener("scroll", scheduleRead, { passive: true });
  ui.transcript.addEventListener("scroll", showJumpNew, { passive: true });

  window.addEventListener("popstate", () => {
    const name = channelFromPath();
    if (name) openChannel(name, false); else location.reload();
  });

  /// The channel in `/c/<name>`, so a channel is a link that can be sent.
  /// A path that is not valid percent-encoding names no channel, which is the
  /// same answer as a path that names none.
  function channelFromPath() {
    const match = location.pathname.match(/^\/c\/([^/]+)\/?$/);
    if (!match) return null;
    try {
      return decodeURIComponent(match[1]);
    } catch (ignored) {
      return null;
    }
  }

  // A channel created or closed on another machine wakes nothing here: it is
  // not a message in the channel this page is following, and with no channel
  // open there is no poll at all. A follower refreshes the list on its own
  // beat, which is up to a hold apart, and this is what keeps the left column
  // from being a minute out of date in between.
  setInterval(() => {
    if (!document.hidden) loadChannels();
  }, CHANNELS_EVERY);

  try { state.name = localStorage.getItem(NAME_KEY); } catch (ignored) { state.name = null; }
  loadPins();
  // The head script stamped both of these before the first paint. Reading them
  // again here is what puts them in the page's own hands, and `applyTheme` is
  // what makes "system" follow the machine from now on rather than only at
  // the moment the page loaded.
  state.theme = kept(THEME_KEY, "system");
  state.rows = kept(ROWS_KEY, "purpose");
  applyTheme();
  setRows(state.rows);
  try { collapse(localStorage.getItem(PANEL_KEY) === "1"); } catch (ignored) { /* private window */ }
  showWho();
  loadChannels();
  const opening = channelFromPath();
  showChannels(!opening);
  if (opening) openChannel(opening, false);
})();
</script>
</body>
</html>
