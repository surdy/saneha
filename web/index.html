<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>saneha</title>
<!-- The favicon is the page: one inline SVG, percent-encoded so that nothing
     here is a fetch to anywhere. The server is on a LAN and a tailnet and may
     have no route out at all. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%232c50cc%22%2F%3E%3Cpath%20d%3D%22M7%208.5h18a2%202%200%200%201%202%202v9a2%202%200%200%201-2%202h-9l-6.5%205v-5H7a2%202%200%200%201-2-2v-9a2%202%200%200%201%202-2z%22%20fill%3D%22%23ffffff%22%2F%3E%3C%2Fsvg%3E">
<script>
// Before the first paint, and before the stylesheet is even read: the theme
// this browser was told to use, or what the machine says when it was told
// "system". Anything later than this is a flash of the wrong palette on every
// load, which is the one thing a theme setting must not introduce.
//
// It is deliberately tiny and standalone — no page state, nothing to wait
// for — and everything else about the theme is in the script at the bottom.
(function () {
  var kept = null;
  try { kept = localStorage.getItem("saneha.theme"); } catch (e) { /* private window */ }
  var dark = kept === "dark" || (kept !== "light" &&
    window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  var root = document.documentElement;
  root.dataset.theme = dark ? "dark" : "light";
  // So the browser's own furniture — scrollbars, form controls, the canvas
  // behind the page — is the same theme as the page.
  root.style.colorScheme = dark ? "dark" : "light";
  try {
    if (localStorage.getItem("saneha.rows") === "name") root.dataset.rows = "name";
  } catch (e) { /* private window */ }
})();
</script>
<style>
:root {
  --bg: #e9ecf1; --panel: #ffffff; --panel2: #f4f6f9; --panel3: #eceff4;
  --fg: #161a21; --fg2: #39404b; --muted: #5d6673;
  --line: #dde1e8; --line2: #c8ced9;
  --accent: #2c50cc; --ink: #23409f; --soft: #e5ebfd; --aline: #b7c5f4; --on: #ffffff;
  --code: #f2f4f8; --cline: #e0e4ec; --danger: #9d2531;
  --s1: 0 1px 2px rgba(20,26,38,.07);
  --s2: 0 1px 2px rgba(20,26,38,.06), 0 10px 24px -10px rgba(20,26,38,.24);
  --ring: 0 0 0 3px rgba(44,80,204,.18);
  --ui: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
  --sans: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  /* The rail is its own surface: the channels and the app bar are never the
     colour of the transcript, so the eye knows which of the two it is in
     without reading either. Ink — cool slate with a trace of the accent hue —
     rather than the accent itself, which is wanted inside the transcript for
     mentions and would be competing with itself out here. */
  --rail: #202737; --rail2: #2b3346; --rail-fg: #e9ecf3; --rail-muted: #b6c0d1;
  --rail-head: #98a4ba; --rail-line: #303a4c;
  --rail-sel: #2c50cc; --rail-sel-fg: #ffffff; --rail-sel-sub: #c6d2ff;
  --rail-badge: #4f70e8; --rail-badge-fg: #ffffff;
  --rail-btn: #2e3749; --rail-btn-line: #3d4759;
}
/* One small palette, hashed from the host, so every machine in a channel has
   a colour and the ink on it clears AA in both themes. `web` is pinned to the
   teal, so the person posting from this page is always the same colour. */
.h0 { --hb: #1a6660; --hi: #fff }
.h1 { --hb: #6a45a6; --hi: #fff }
.h2 { --hb: #9a4a1c; --hi: #fff }
.h3 { --hb: #1f5299; --hi: #fff }
.h4 { --hb: #97303f; --hi: #fff }
.h5 { --hb: #2c6b3a; --hi: #fff }
.h6 { --hb: #4b3fa8; --hi: #fff }
.h7 { --hb: #8f3572; --hi: #fff }
/* The dark palette hangs off an attribute rather than a media query, because
   the page has to be able to say "dark" when the machine says light. The
   attribute is stamped on <html> before anything paints — by the script in
   the head, from what was kept in this browser or, for "system", from what
   the machine says — so there is one dark palette here and not two. */
[data-theme="dark"] {
  --bg: #0e1116; --panel: #171b21; --panel2: #1d222a; --panel3: #232932;
  --fg: #e8ebf0; --fg2: #c3cad4; --muted: #98a2b0;
  --line: #262d36; --line2: #39424e;
  --accent: #8ea6ff; --ink: #b5c5ff; --soft: #1c2540; --aline: #33437a; --on: #0d1220;
  --code: #10141a; --cline: #262d36; --danger: #f19a9a;
  --s1: 0 1px 2px rgba(0,0,0,.5);
  --s2: 0 1px 2px rgba(0,0,0,.5), 0 10px 24px -10px rgba(0,0,0,.75);
  --ring: 0 0 0 3px rgba(142,166,255,.22);
  /* In the dark the rail goes UNDER the transcript rather than over it: the
     sidebar is the darkest surface on the page, not a lighter one, so the
     same separation reads the same way round. */
  --rail: #090c11; --rail2: #151a22; --rail-fg: #dfe4ec; --rail-muted: #99a3b3;
  --rail-head: #7a8494; --rail-line: #1a2029;
  --rail-sel: #2b3c7d; --rail-sel-fg: #dee6ff; --rail-sel-sub: #9db0ec;
  --rail-badge: #5f7cf0; --rail-badge-fg: #0b1020;
  --rail-btn: #171d26; --rail-btn-line: #262e3a;
  }
[data-theme="dark"] .h0 { --hb: #79cec4; --hi: #082a27 }
[data-theme="dark"] .h1 { --hb: #b9a2ea; --hi: #211a33 }
[data-theme="dark"] .h2 { --hb: #e0a377; --hi: #2c1a0c }
[data-theme="dark"] .h3 { --hb: #93bdf0; --hi: #0c1e38 }
[data-theme="dark"] .h4 { --hb: #eda3ad; --hi: #33101a }
[data-theme="dark"] .h5 { --hb: #8fd0a0; --hi: #0b2413 }
[data-theme="dark"] .h6 { --hb: #aeaaf0; --hi: #191534 }
[data-theme="dark"] .h7 { --hb: #e2a4cd; --hi: #33112a }

* { box-sizing: border-box }
html, body { height: 100% }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 13.5px/1.5 var(--sans);
}
button, input, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.mono { font-family: var(--mono) }
.sp { flex: 1 }
.i { width: 13px; height: 13px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round }
.i.b { width: 15px; height: 15px }

/* the shared controls */
.btn {
  height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 11px;
  border: 1px solid var(--line2); border-radius: 8px; background: var(--panel);
  color: var(--fg2); font-family: var(--ui); font-size: 12px; cursor: pointer;
}
.btn:hover { border-color: var(--accent); color: var(--fg) }
.ic { width: 32px; height: 32px; justify-content: center; padding: 0; background: var(--panel2); color: var(--muted) }
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px;
  border-radius: 8px; background: var(--panel2); border: 1px solid var(--line);
  font-family: var(--ui); font-size: 11.5px; color: var(--fg2); white-space: nowrap;
}
.av {
  width: 30px; height: 30px; border-radius: 9px; background: var(--hb, var(--panel3)); color: var(--hi, var(--muted));
  font-family: var(--mono); font-size: 11.5px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
}
.av.s { width: 20px; height: 20px; border-radius: 7px; font-size: 9px }
.av.md { width: 28px; height: 28px; border-radius: 9px; font-size: 11px }
.av.aw { background: var(--panel3); color: var(--muted); border: 1px dashed var(--line2) }
.tag { height: 17px; padding: 0 6px; border: 1px solid var(--line2); border-radius: 999px; font-size: 10px; display: inline-flex; align-items: center }
.st {
  height: 20px; padding: 0 8px; border: 1px solid var(--aline); border-radius: 999px;
  background: var(--soft); color: var(--ink);
  font-family: var(--ui); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center;
}
.st.cl { border-color: var(--line2); background: none; color: var(--muted); font-weight: 400 }
.rhead {
  flex: 0 0 44px; height: 44px; display: flex; align-items: center; gap: 8px;
  padding: 0 8px 0 14px; border-bottom: 1px solid var(--line);
}
.rt { flex: 1; font-family: var(--ui); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }

#app { display: flex; flex-direction: column; height: 100% }
#bar {
  flex: 0 0 52px; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 16px;
  background: var(--rail); color: var(--rail-fg); border-bottom: 1px solid var(--rail-line);
  position: relative; z-index: 3;
}
#mark { width: 26px; height: 26px; flex: 0 0 26px; border-radius: 8px; background: var(--rail-sel); color: var(--rail-sel-fg); display: flex; align-items: center; justify-content: center }
#mark .i { width: 16px; height: 16px }
#name { font-family: var(--ui); font-size: 16px; font-weight: 600; letter-spacing: .01em }
.who { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 6px 0 10px; border: 1px solid var(--rail-btn-line); border-radius: 9px; background: var(--rail-btn) }
.who .wl { font-family: var(--ui); font-size: 11.5px; color: var(--rail-muted) }
#whoId { font-family: var(--mono); font-size: 12.5px }
#who { height: 28px; padding: 0 9px; font-size: 11.5px; background: none; border-color: var(--rail-btn-line); color: var(--rail-muted) }
#who.ic { width: 28px; padding: 0 }
#who:hover { color: var(--rail-fg); border-color: var(--rail-muted) }
/* jump to a channel: the whole channel list is already in hand, so this is a
   filter over it rather than a search anybody has to answer */
#jump {
  display: flex; align-items: center; gap: 8px; height: 30px; width: min(300px, 30vw); padding: 0 10px;
  border: 1px solid var(--rail-btn-line); border-radius: 8px; background: var(--rail-btn);
  color: var(--rail-muted); font-family: var(--ui); font-size: 12px; cursor: pointer;
}
#jump:hover { border-color: var(--rail-muted); color: var(--rail-fg) }
#jump .jt { flex: 1; text-align: left }
#jump kbd { font-family: var(--mono); font-size: 11px; opacity: .75 }
#row { flex: 1; min-height: 0; display: flex; position: relative }

#channels { width: 264px; flex: 0 0 264px; background: var(--rail); color: var(--rail-fg); display: flex; flex-direction: column; min-height: 0 }
#channels .rhead { border-bottom: 0 }
#channels .rt { color: var(--rail-head) }
#channels .btn { border-color: var(--rail-btn-line); background: var(--rail-btn); color: var(--rail-fg) }
#channels .btn:hover { border-color: var(--rail-muted) }
#channelList { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 1px }
.ch {
  display: flex; align-items: flex-start; gap: 8px; width: 100%; text-align: left; position: relative;
  padding: 6px 8px 6px 9px; border: 0; border-radius: 7px; background: none; cursor: pointer; color: inherit;
}
.ch:hover, .ch.menu { background: var(--rail2) }
.ch.on { background: var(--rail-sel) }
.ch .cc { flex: 1; min-width: 0 }
/* the row is a div holding buttons, so the name is the button that opens it
   and the handle beside it is a button of its own */
.ch .op { display: block; width: 100%; min-width: 0; padding: 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; font: inherit }
/* the hash is the channel glyph: quieter than the name, and the one thing
   that says "this is a channel" before the name is read */
.ch .hs { flex: 0 0 auto; font-family: var(--mono); font-size: 12.5px; color: var(--rail-muted); line-height: 20px }
.ch .cn { display: block; font-family: var(--mono); font-size: 12.5px; color: var(--rail-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
/* unread is weight, not only a badge: the list is scannable without reading it */
.ch.un .cn, .ch.un .hs { color: var(--rail-fg); font-weight: 600 }
.ch.on .cn { color: var(--rail-sel-fg); font-weight: 600 }
.ch.on .hs { color: var(--rail-sel-sub) }
.ch.cl { opacity: .62 }
.ch.cl .i { color: var(--rail-muted) }
/* "name only" in the settings: the rail is the names and nothing else, which
   is about twice as many channels on a screen. */
[data-rows="name"] .ch .cp { display: none }
.ch .cp { display: block; font-size: 11px; color: var(--rail-head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px }
.ch.on .cp { color: var(--rail-sel-sub) }
.bdg {
  min-width: 20px; height: 19px; padding: 0 6px; border-radius: 999px; background: var(--rail-badge); color: var(--rail-badge-fg);
  font-family: var(--mono); font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; margin-top: 1px;
}
.ch.on .bdg { background: rgba(255,255,255,.22); color: var(--rail-sel-fg) }
/* one handle per row, over the space the badge uses, on hover or focus */
.more2 {
  width: 26px; height: 26px; flex: 0 0 26px; display: none; align-items: center; justify-content: center;
  border: 0; border-radius: 7px; background: var(--rail-btn); color: var(--rail-fg); cursor: pointer; padding: 0;
}
.ch:hover .more2, .ch.menu .more2, .more2:focus-visible { display: flex }
.ch:hover .bdg, .ch.menu .bdg { display: none }
.grp { display: flex; align-items: center; gap: 7px; padding: 11px 9px 5px }
.grp span:first-of-type { font-family: var(--ui); font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--rail-head) }
.grp .i { color: var(--rail-head) }
.grp .ln2 { flex: 1; height: 1px; background: var(--rail-line) }
#channels .empty { color: var(--rail-head) }

/* the row menu, and the palette: both are panels floating over the page, so
   they take the transcript's surface rather than the rail's */
.pop {
  position: fixed; z-index: 20; min-width: 190px; padding: 5px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--panel); box-shadow: var(--s2); display: flex; flex-direction: column; gap: 1px;
}
.mi {
  display: flex; align-items: center; gap: 9px; width: 100%; height: 30px; padding: 0 9px; border: 0;
  border-radius: 7px; background: none; color: var(--fg2); font-family: var(--ui); font-size: 12.5px;
  text-align: left; cursor: pointer;
}
.mi:hover { background: var(--panel2) }
.mi.dg { color: var(--danger) }
.mi.dg:hover { background: var(--panel2) }
.mi .sub { color: var(--muted); font-family: var(--mono); font-size: 11.5px }
.msep { height: 1px; background: var(--line); margin: 4px 6px }

#veil { position: fixed; inset: 0; z-index: 19 }
#palette {
  position: fixed; z-index: 20; top: 12vh; left: 50%; transform: translateX(-50%);
  width: min(520px, 92vw); border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
  box-shadow: var(--s2); overflow: hidden; display: flex; flex-direction: column; max-height: 70vh;
}
#paletteInput {
  height: 44px; flex: 0 0 44px; width: 100%; padding: 0 13px; border: 0; border-bottom: 1px solid var(--line);
  background: none; font-family: var(--mono); font-size: 13.5px; outline: none;
}
#paletteList { flex: 1; min-height: 0; overflow-y: auto; padding: 5px; display: flex; flex-direction: column; gap: 1px }
.pi2 {
  display: flex; align-items: center; gap: 9px; width: 100%; height: 36px; padding: 0 9px; border: 0;
  border-radius: 8px; background: none; text-align: left; cursor: pointer; color: var(--fg2);
}
.pi2[aria-selected="true"] { background: var(--soft); color: var(--ink) }
.pi2 .pnm { flex: 0 0 auto; font-family: var(--mono); font-size: 13px }
.pi2 .pnm .hs { color: var(--muted) }
.pi2[aria-selected="true"] .pnm .hs { color: var(--ink); opacity: .6 }
.pi2 mark { background: none; color: inherit; font-weight: 700; text-decoration: underline }
.pi2 .pcp { flex: 1; min-width: 0; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.pi2[aria-selected="true"] .pcp { color: var(--ink); opacity: .8 }
.pi2 .bdg { margin-top: 0; background: var(--accent); color: var(--on) }
#paletteFoot {
  flex: 0 0 32px; height: 32px; display: flex; align-items: center; gap: 14px; padding: 0 13px;
  border-top: 1px solid var(--line); background: var(--panel2);
  font-family: var(--ui); font-size: 11px; color: var(--muted);
}
#paletteEmpty { padding: 18px 0; text-align: center; color: var(--muted); font-size: 12.5px }

main { flex: 1; min-width: 0; display: flex; flex-direction: column }
#topbar {
  flex: 0 0 80px; height: 80px; display: flex; align-items: center; gap: 14px; padding: 0 20px;
  background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: var(--s1); position: relative; z-index: 2;
}
.ti { min-width: 0 }
.t1 { display: flex; align-items: center; gap: 8px }
#channelName { font-family: var(--mono); font-size: 17px; font-weight: 600; letter-spacing: -.01em }
#channelName .hs { color: var(--muted); font-weight: 400 }
#purposeRow { display: flex; align-items: center; gap: 6px; margin-top: 1px; min-width: 0 }
#channelPurpose {
  font: inherit; font-size: 12.5px; color: var(--muted); text-align: left; padding: 0;
  border: 0; background: none; cursor: text; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#channelPurpose.none { color: var(--ink); font-family: var(--ui) }
#purposeRow .pe { width: 20px; height: 20px; flex: 0 0 20px; visibility: hidden; padding: 0; border: 0; border-radius: 6px; background: var(--panel2); color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer }
#purposeRow:hover .pe, #channelPurpose:focus-visible + .pe, .pe:focus-visible { visibility: visible }
#purposeEdit { display: flex; align-items: center; gap: 8px; margin-top: 2px; min-width: 0 }
#purposeInput {
  flex: 1; min-width: 0; max-width: 420px; height: 28px; padding: 0 8px; border: 1px solid var(--aline);
  border-radius: 7px; background: var(--panel); box-shadow: var(--ring); font-size: 12.5px; outline: none;
}
#purposeHint { font-family: var(--ui); font-size: 11px; color: var(--muted); white-space: nowrap }
#purposeCount { font-family: var(--mono); font-size: 11px; color: var(--muted) }
#purposeCount.over { color: var(--danger) }
#headAvatars { display: flex; align-items: center; gap: 4px; border: 0; background: none; padding: 2px; border-radius: 10px; cursor: pointer }
#headAvatars:hover { background: var(--panel2) }
#banner { padding: 8px 20px; background: var(--soft); color: var(--ink); border-bottom: 1px solid var(--aline); font-size: 12.5px }

#twrap { flex: 1; min-height: 0; display: flex; position: relative }
#transcript { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 20px 16px; display: flex; flex-direction: column; gap: 11px }
/* A short transcript sits at the bottom, against the compose box, rather than
   floating at the top of an empty column; a long one still scrolls. */
#transcript > :first-child { margin-top: auto }
.r { display: flex; gap: 12px; align-items: flex-start }
.g { width: 30px; flex: 0 0 30px; display: flex; justify-content: center; padding-top: 1px }
.c { flex: 1; min-width: 0 }
.m { width: 56px; flex: 0 0 56px; display: flex; align-items: center; justify-content: flex-end; gap: 4px; padding-top: 3px }
.m .ln { width: 10px; height: 1px; background: var(--line2) }
.more { font-family: var(--ui); font-size: 11px; color: var(--muted); padding: 0 1px }
.hd { display: flex; align-items: center; gap: 7px; min-height: 20px }
.hd .nm { font-family: var(--ui); font-size: 13.5px; font-weight: 600 }
.hd .hg { color: var(--muted) }
.hd .hs, .hd .tm { font-family: var(--mono); font-size: 11px; color: var(--muted) }
.hd .to { font-family: var(--ui); font-size: 11px; color: var(--muted) }
/* A narrow column shortens the name and the recipients rather than folding
   the header into three lines: the stamp is the one part that never wraps. */
.hd .nm, .hd .to, .r.sy .c > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tm { flex: 0 0 auto; white-space: nowrap }
.br { display: none }
.hd .to b { color: var(--ink); font-weight: 500 }
.bd { font-size: 13.5px; color: var(--fg2); overflow-wrap: anywhere }
.bd p { margin: 4px 0 0 }
.bd code { font-family: var(--mono); font-size: 12px; background: var(--code); border: 1px solid var(--cline); border-radius: 5px; padding: 0 4px }
.bd pre {
  margin: 6px 0 0; background: var(--code); border: 1px solid var(--cline); border-radius: 9px;
  padding: 8px 11px; overflow-x: auto; font-size: 12px; line-height: 16px;
}
.bd pre code { background: none; border: 0; padding: 0 }
.mention { background: var(--soft); color: var(--ink); border-radius: 5px; padding: 1px 4px; font-weight: 600 }
.r.cont { margin-top: -7px }
.r.sy { align-items: center }
.r.sy + .r.sy { margin-top: -9px }
.r.sy .c { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted) }
.r.sy .g { color: var(--muted); padding-top: 0 }
.r.sy .m { padding-top: 0 }
.r.sy .tm { font-family: var(--mono); font-size: 11px }
.at { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px }
.att {
  display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px 0 8px;
  border: 1px solid var(--line); border-radius: 9px; background: var(--panel); box-shadow: var(--s1);
  text-decoration: none; font-family: var(--mono); font-size: 12px; color: var(--ink);
}
.att .i { color: var(--accent) }
.att .sz { font-size: 11px; color: var(--muted) }
.dv { display: flex; align-items: center; gap: 10px; min-height: 22px }
.dv::before, .dv::after { content: ""; flex: 1; height: 1px; background: var(--line) }
.dv span { display: inline-flex; align-items: center; gap: 5px; font-family: var(--ui); font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted) }
.dv.up span { font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 11px }
/* where the reading stopped: the rule the newest messages sit under */
.dv.new { gap: 10px }
.dv.new::before { display: none }
.dv.new::after { background: var(--aline) }
.dv.new .nw {
  height: 20px; padding: 0 9px; border-radius: 999px; background: var(--accent); color: var(--on);
  font-family: var(--ui); font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  display: inline-flex; align-items: center; text-transform: uppercase;
}
.dv.new .at2 { font-family: var(--mono); font-size: 11px; color: var(--ink); order: 3 }
#jumpNew {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 4;
  display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 6px 0 12px; border: 0; border-radius: 999px;
  background: var(--accent); color: var(--on); box-shadow: var(--s2);
  font-family: var(--ui); font-size: 12px; font-weight: 600; cursor: pointer;
}
#jumpNew .rnd { display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 999px; background: rgba(255,255,255,.2) }
.empty { color: var(--muted); padding: 24px 0; text-align: center }

#status { font-size: 12px; color: var(--muted); padding: 0 20px 6px }
#compose { padding: 10px 20px calc(14px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line) }
.fld { border: 1px solid var(--line2); border-radius: 10px; background: var(--panel); box-shadow: var(--s2); padding: 8px 8px 8px 12px; display: flex; flex-direction: column; gap: 6px }
.fld:focus-within { border-color: var(--aline); box-shadow: var(--s2), var(--ring) }
#body { border: 0; background: none; padding: 0; width: 100%; min-height: 40px; resize: none; outline: none; font-size: 13.5px }
.crow { display: flex; align-items: center; gap: 10px }
#composeHint { flex: 1; font-family: var(--ui); font-size: 11.5px; color: var(--muted) }
.sendb {
  height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 13px;
  border: 1px solid var(--accent); border-radius: 8px; background: var(--accent); color: var(--on);
  font-family: var(--ui); font-size: 12.5px; font-weight: 600; cursor: pointer; box-shadow: var(--s1);
}
#sendError { color: var(--danger); font-size: 12.5px; margin-top: 6px; white-space: pre-wrap }

#people { width: 236px; flex: 0 0 236px; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0 }
#people.col { width: 54px; flex: 0 0 54px }
#people.col .rt, #people.col .pi, #people.col #peopleFoot { display: none }
#people.col .rhead { padding: 0 11px }
#people.col #panelToggle .i { transform: scaleX(-1) }
#people.col .p { justify-content: center; padding: 6px }
#peopleList { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px }
.p { display: flex; gap: 9px; padding: 8px 9px; border-radius: 9px; background: var(--panel2); border: 1px solid var(--line) }
.p.me { background: var(--soft); border-color: var(--aline) }
.p.away { background: var(--panel); border-style: dashed; border-color: var(--line2) }
.pi { flex: 1; min-width: 0 }
.pn { font-family: var(--mono); font-size: 12px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.p.away .pn { color: var(--muted) }
.pn .you { font-family: var(--ui); font-size: 10.5px; color: var(--ink) }
.ph2 { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.p.me .ph2, .p.me .pf, .p.me .pr { color: var(--ink) }
.pf, .pr { display: flex; align-items: center; gap: 5px; margin-top: 3px; font-size: 11px; color: var(--muted) }
.pf { font-family: var(--ui) }
.pr { font-family: var(--mono) }
.pr.ok { color: var(--ink) }
#peopleFoot { padding: 8px 14px; border-top: 1px solid var(--line); font-family: var(--ui); font-size: 11px; color: var(--muted) }
#scrim { display: none }

dialog {
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--fg);
  padding: 18px; min-width: min(360px, 92vw); box-shadow: var(--s2);
}
dialog::backdrop { background: rgba(6,9,14,.5) }
dialog h2 { margin: 0 0 10px; font-family: var(--ui); font-size: 15px }
dialog label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px }
dialog input { width: 100%; background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 7px 9px }
dialog .drow { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px }
/* a choice of two or three, all of them on screen: there is no room in any of
   these for an option to hide behind a closed menu */
.seg { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line2); border-radius: 9px; background: var(--panel2) }
.sg {
  flex: 1; height: 30px; padding: 0 10px; border: 0; border-radius: 6px; background: none;
  color: var(--fg2); font-family: var(--ui); font-size: 12px; cursor: pointer; white-space: nowrap;
}
.sg:hover { color: var(--fg) }
.sg[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: var(--s1) }
.setrow { display: flex; align-items: center; gap: 8px; min-height: 34px }
#settingsId { font-size: 12.5px }
dialog p { font-size: 12px; color: var(--muted); margin: 8px 0 0 }
.pri { border-color: var(--accent); background: var(--accent); color: var(--on); font-weight: 600 }
.pri:hover { color: var(--on) }
.ph { display: none }

/* One column on a phone: a channels screen, a transcript screen, and the
   participants as a sheet over the transcript. */
@media (max-width: 860px) {
  .ph { display: flex }
  .dk, .sl { display: none }
  /* the channels screen */
  #bar { display: none; padding: 0 10px; gap: 8px }
  #app.vc #bar { display: flex }
  #who { width: 30px; padding: 0; justify-content: center }
  /* the channels screen is the rail at full width: the tint does more work
     here than anywhere, because it is the whole screen */
  #channels { display: none; width: auto; flex: 1 }
  #app.vc #channels { display: flex }
  #app.vc main { display: none }
  #app.vc { background: var(--rail) }
  #channelList { gap: 6px; padding: 0 12px 12px }
  .ch { padding: 10px 12px; border-radius: 12px; background: var(--rail2); min-height: 56px; align-items: center }
  .ch.on { background: var(--rail-sel) }
  .ch.cl { background: none; box-shadow: inset 0 0 0 1px var(--rail-line) }
  .ch .hs, .ch .cn { font-size: 14.5px }
  .ch .cp { font-size: 12px }
  /* on a touch screen there is no hover to reveal a handle, so it is always
     there — and 44px, which is why it is not the 26px the desk uses */
  .more2 { display: flex; width: 44px; height: 44px; flex: 0 0 44px; background: none; color: var(--rail-muted) }
  .ch:hover .bdg, .ch.menu .bdg { display: flex }
  .grp { padding: 12px 4px 4px }
  #jump { width: 40px; height: 40px; flex: 0 0 40px; padding: 0; justify-content: center; border-radius: 11px }
  #jump .jt { display: none }
  /* the transcript screen: the channel head is its top bar, on the rail too */
  #topbar { flex: 0 0 62px; height: 62px; gap: 10px; padding: 0 10px; background: var(--rail); color: var(--rail-fg); border-bottom-color: var(--rail-line) }
  #toChannels { width: 44px; height: 44px; border-radius: 12px; background: var(--rail-btn); border-color: var(--rail-btn-line); color: var(--rail-fg) }
  #channelName { font-size: 15px; color: var(--rail-fg) }
  #channelName .hs { color: var(--rail-muted) }
  #topbar .st { border-color: var(--rail-btn-line); background: var(--rail-btn); color: var(--rail-muted) }
  #topbar .st.cl { border-color: var(--rail-btn-line); color: var(--rail-muted) }
  #channelPurpose { color: var(--rail-head) }
  #channelPurpose.none { color: var(--rail-sel-sub) }
  #purposeRow .pe { background: var(--rail-btn); color: var(--rail-muted); visibility: visible }
  #headAvatars { padding: 4px 6px; border: 1px solid var(--rail-btn-line); border-radius: 13px; background: var(--rail-btn) }
  #transcript { padding: 10px 12px 14px; gap: 10px }
  /* the read cursors move under the message, right-aligned, rather than into
     a margin there is no room for */
  .r { flex-wrap: wrap; gap: 0 10px }
  .m { flex: 0 0 100%; width: auto; padding-top: 2px }
  .m .ln { display: none }
  .r.sy { flex-wrap: nowrap }
  .r.sy .m { flex: 0 0 auto; padding-top: 0 }
  /* and the header takes two lines: who and when, then where and to whom */
  .hd { flex-wrap: wrap }
  .hd .nm { order: 1 } .hd .hg { order: 2 } .hd .sp { order: 3 } .hd .tm { order: 4 }
  .br { display: block; order: 5; flex: 0 0 100%; height: 0 }
  .hd .hs { order: 6 } .hd .to { order: 7 }
  #compose { padding: 8px 12px calc(10px + env(safe-area-inset-bottom)) }
  #body { min-height: 22px }
  #composeHint { font-size: 11px }
  .sendb { width: 38px; height: 38px; padding: 0; border-radius: 999px; justify-content: center }
  #status { padding: 0 12px 4px }
  /* the participants sheet */
  #people {
    position: fixed; left: 0; right: 0; bottom: 0; top: 34%; width: auto; flex: none;
    border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
    box-shadow: var(--s2); z-index: 9; transform: translateY(102%); transition: transform .18s ease-out;
  }
  #people::before {
    content: ""; position: absolute; top: 7px; left: 50%; margin-left: -18px;
    width: 36px; height: 4px; border-radius: 2px; background: var(--line2);
  }
  #app.vs #people { transform: none }
  #people.col { width: auto; flex: none }
  #people.col .rt, #people.col .pi, #people.col #peopleFoot { display: block }
  #people .rhead { flex: none; height: auto; flex-wrap: wrap; gap: 10px; padding: 18px 14px 12px }
  #people .rt { flex: 1 1 calc(100% - 46px); order: 1 }
  #sheetClose { order: 2 }
  #caughtChip2 { order: 3; margin-right: auto; height: 30px }
  #closeChannel2 { order: 4 }
  #peopleList { gap: 8px; padding: 0 12px 12px }
  /* one participant is two lines: who, then what it runs and where it has read */
  .pi { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; column-gap: 6px }
  .pn { grid-area: 1 / 1 } .ph2 { grid-area: 1 / 2 / 1 / 5 }
  .pf { grid-area: 2 / 1 / 2 / 4 } .pr { grid-area: 2 / 4; justify-self: end }
  #app.vs #scrim { display: block; position: fixed; inset: 0; background: rgba(6,9,14,.4); z-index: 8 }
  #palette { top: 0; left: 0; right: 0; transform: none; width: auto; max-height: 100%; height: 100%; border: 0; border-radius: 0 }
  #paletteInput { height: 52px; flex: 0 0 52px }
  .pi2 { height: 48px }
  /* a menu opened from a row is a sheet at the bottom, where a thumb is */
  .pop { left: 8px !important; right: 8px; top: auto !important; bottom: calc(8px + env(safe-area-inset-bottom)); min-width: 0 }
  .mi { height: 46px; font-size: 14px }
}
[hidden] { display: none !important }
</style>
